name: something2

services:
  frontend:
    build:
      context: .
      dockerfile: compose/develop/frontend.Dockerfile
    ports:
      - "15173:5173"
    volumes:
      - ./frontend:/app
      - ./backend:/backend:ro
    environment:
      # VITE_API_URL is deliberately NOT set: the client then calls relative
      # /api and /authority, which vite proxies to the backend, so the same
      # container serves localhost:15173 and any tunnel without a recreate.
      - VITE_ENGINE_WS_URL=ws://localhost:18080/ws
      # Reserved ngrok domain, only used by vite.config.js to extend
      # allowedHosts. Presence does not switch anything into a tunnel mode.
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: compose/develop/backend.Dockerfile
    ports:
      - "13101:3101"
    volumes:
      - ./backend:/app
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/game_db
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # SOMET-381. Dev really is cross-origin -- vite serves :15173 and the API
      # answers on :13101 -- so the allowlist must name it or every browser call
      # fails preflight. Production needs no entries at all: Caddy fronts both
      # on one origin there. Tunnels are same-origin (vite proxies /api), so they need no entry.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:15173,http://127.0.0.1:15173}
      # Registration stays open on a workstation; production chooses explicitly.
      - REGISTRATION_MODE=${REGISTRATION_MODE:-open}
      # Email accounts (Gmail SMTP). Blank = console mailer, gate inactive.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - APP_URL=${APP_URL:-}
      # SOMET-718. Mounts /api/board (the pi helper proxy). Never set in compose/orangepi.
      - BOARD_TAB_ENABLED=${BOARD_TAB_ENABLED:-1}
      # Mounts the admin Tunnels tab. Dev laptop compose only -- never set in compose/orangepi.
      - TUNNEL_TAB_ENABLED=true
      - SPRITE_GEN_URL=http://sprite-gen:8100
      # Tunnels tab. Empty = the unix socket (native Linux); on Docker Desktop (Windows/Mac) a
      # socket does not cross the bind mount, so .env sets this to http://host.docker.internal:<port>
      # and runs the helper with TUNNEL_HELPER_PORT=<port>.
      - TUNNEL_HELPER_URL=${TUNNEL_HELPER_URL:-}
      # SOMET-551. The prompt-writing model runs on the HOST, not in compose:
      # it is CPU-only and deliberately kept off the GPU box, whose effective
      # VRAM headroom is under one SDXL pipeline. `localhost` is the right
      # default for a backend run directly on the host, and wrong inside a
      # container -- where it means the container itself. host.docker.internal
      # is resolved by the extra_hosts entry below rather than by a hardcoded
      # bridge IP, which drifts whenever the compose network is recreated.
      - ART_DESCRIBER_URL=${ART_DESCRIBER_URL:-http://host.docker.internal:20434/v1/chat/completions}
      - ART_DESCRIBER_MODEL=${ART_DESCRIBER_MODEL:-qwen2.5-coder:7b}
      - SPRITE_GEN_SHARED_SECRET=${SPRITE_GEN_SHARED_SECRET:?SPRITE_GEN_SHARED_SECRET must be set in .env}
      - SEED_PC_LABEL=${SEED_PC_LABEL:-}
      # The in-game admin menu code (Settings -> Admin). Empty = nobody can enter a code. See .env.example.
      - ADMIN_MENU_CODE=${ADMIN_MENU_CODE:-}
      # Preserves the existing dev experience: `make up` migrates and serves in
      # one step. compose/orangepi does NOT set this -- there, migrations are
      # their own deploy stage (see backend/src/index.js's shouldMigrateOnBoot).
      - MIGRATE_ON_BOOT=true
      # A restart (nodemon, any pull touching backend/src) must not end a sprite
      # batch. Set on this one stack only: it claims rows from the whole
      # database, so a second instance sharing it must leave this unset.
      - SPRITE_RESUME_ON_BOOT=true
      # Same rule for effect sprite jobs (effect_sprite_jobs): a restart
      # re-polls the box job a running row already paid for.
      - EFFECT_RESUME_ON_BOOT=true
    # Makes host.docker.internal resolve on Linux, where Docker does not
    # provide it by default. Without it the backend cannot reach any service
    # running on the workstation itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - minio

  game-engine:
    build:
      context: .
      dockerfile: compose/develop/engine.Dockerfile
    ports:
      - "18080:8080"
    volumes:
      - ./engine:/app
    environment:
      - ENGINE_PORT=8080
      - ENGINE_TICK_HZ=${ENGINE_TICK_HZ:-60}
      - ENGINE_FLUSH_INTERVAL=${ENGINE_FLUSH_INTERVAL:-5m}
      - ENGINE_IDLE_EVICT=${ENGINE_IDLE_EVICT:-10m}
      - ENGINE_AOI_RADIUS=${ENGINE_AOI_RADIUS:-30}
      - ENGINE_GRID_CELL_SIZE=${ENGINE_GRID_CELL_SIZE:-4}
      - DATABASE_URL=postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/game_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - db
      - redis

  sprite-gen:
    build:
      context: .
      dockerfile: sprite-gen/Dockerfile
    ports:
      - "18100:8100"
    environment:
      - DEVICE=cpu
      - SPRITE_BACKEND=sd-turbo
      - SPRITE_STORE_ENABLED=true
      - N_FRAMES=4
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - MINIO_BUCKET=sprites
      - SPRITE_GEN_SHARED_SECRET=${SPRITE_GEN_SHARED_SECRET:?SPRITE_GEN_SHARED_SECRET must be set in .env}
      # SOMET-539. DB 1, not 0 -- the game-engine's live state is on DB 0 and
      # the job store must never share keyspace with it. A GPU-box
      # deployment runs its own `redis` container and overrides this;
      # nothing here crosses machines except HTTP.
      - REDIS_URL=redis://redis:6379/1
      - SPRITE_GEN_WORKERS=${SPRITE_GEN_WORKERS:-1}
    volumes:
      - sprite-models:/root/.cache/huggingface
    depends_on:
      - minio
      - redis

  # SOMET-368 -- public tunnel so someone outside this machine can play.
  # It points at the *frontend*, not the backend: vite proxies /api and the
  # /authority websocket through to backend:3101 (frontend/vite.config.js), so
  # one tunnel covers all three surfaces the game needs.
  #
  # Behind the `tunnel` profile deliberately: `make up` must never open a public
  # URL as a side effect. Start it with `make tunnel`, stop it with
  # `make tunnel-stop`. NGROK_DOMAIN/NGROK_AUTHTOKEN are read bare rather than
  # with the `${VAR:?}` idiom the other services use, because compose
  # interpolates the whole file whatever profile is active -- `:?` here would
  # break plain `make up` for anyone whose .env has no ngrok keys. `make tunnel`
  # does that check instead.
  #
  # Free tier allows ONE online agent per account: if another ngrok container is
  # up on the same authtoken, this one fails to bind and says so. That is the
  # correct behaviour, not something to work around.
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    command: http frontend:5173 --url=https://${NGROK_DOMAIN} --log=stdout --log-format=logfmt
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      # Request inspector, loopback-only -- the tunnel itself is the public part.
      - "127.0.0.1:14040:4040"
    depends_on:
      - frontend

  # ngrok in front of the BUILT frontend (`web`), same reserved domain as `ngrok`
  # above. Inspector on 14041 so both agents can run side by side. No restart
  # policy: a tunnel only ever starts on an explicit request.
  ngrok-prod:
    image: ngrok/ngrok:3
    profiles: ["tunnel-prod"]
    command: http web:80 --url=https://${NGROK_DOMAIN} --log=stdout --log-format=logfmt
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:14041:4040"
    depends_on:
      - web

  # Cloudflare quick tunnel (no account, random *.trycloudflare.com address that changes every
  # start). Behind its own profile so nothing is ever published by accident. `make tunnel-cf`
  # starts it and reads the address from its log; the frontend is not recreated (same-origin).
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles: ["tunnel-cf"]
    command: tunnel --no-autoupdate --url http://frontend:5173
    depends_on:
      - frontend

  # The BUILT frontend (vite bundle, gzip, long cache) in front of THIS stack's backend, for
  # `make tunnel-cf-prod`. Vite's dev server sends hundreds of unbundled modules, which is what
  # makes a first load through a tunnel crawl. Same image and Caddyfile as compose/orangepi, but
  # it proxies to this stack's `backend`, so accounts, characters and art are the ones you
  # already have (the orangepi stack has its own, empty database).
  web:
    profiles: ["tunnel-cf-prod", "tunnel-prod"]
    image: something2-web-prod:local
    build:
      context: .
      dockerfile: compose/orangepi/frontend.Dockerfile
    ports:
      - "127.0.0.1:18081:80"
    depends_on:
      - backend

  cloudflared-prod:
    image: cloudflare/cloudflared:2026.8.2
    profiles: ["tunnel-cf-prod"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=game_db
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  sprite-models: