name: something2

services:
  frontend:
    build:
      context: .
      dockerfile: compose/develop/frontend.Dockerfile
    ports:
      - "15173:5173"
    volumes:
      - ./frontend:/app
    environment:
      # SOMET-370. The client calls the backend at this ABSOLUTE url (and derives
      # the authority ws url from it), so a remote player needs it to be the
      # public origin, not their own machine. `make tunnel` overrides it;
      # everything else gets the localhost default it always had.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:13101}
      - VITE_ENGINE_WS_URL=ws://localhost:18080/ws
      # SOMET-369. Set by `make tunnel` only -- vite.config.js switches on it to
      # allow the tunnel Host and to aim HMR at :443. NOT ${NGROK_DOMAIN}, which
      # is always present in .env and would put local dev in tunnel mode.
      - TUNNEL_HOST=${TUNNEL_HOST:-}
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: compose/develop/backend.Dockerfile
    ports:
      - "13101:3101"
    volumes:
      - ./backend:/app
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/game_db
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # SOMET-381. Dev really is cross-origin -- vite serves :15173 and the API
      # answers on :13101 -- so the allowlist must name it or every browser call
      # fails preflight. Production needs no entries at all: Caddy fronts both
      # on one origin there. `make tunnel` adds its public origin on top.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:15173,http://127.0.0.1:15173}
      # Registration stays open on a workstation; production chooses explicitly.
      - REGISTRATION_MODE=${REGISTRATION_MODE:-open}
      - SPRITE_GEN_URL=http://sprite-gen:8100
      - SPRITE_GEN_SHARED_SECRET=${SPRITE_GEN_SHARED_SECRET:?SPRITE_GEN_SHARED_SECRET must be set in .env}
      # Preserves the existing dev experience: `make up` migrates and serves in
      # one step. compose/orangepi does NOT set this -- there, migrations are
      # their own deploy stage (see backend/src/index.js's shouldMigrateOnBoot).
      - MIGRATE_ON_BOOT=true
    depends_on:
      - db
      - minio

  game-engine:
    build:
      context: .
      dockerfile: compose/develop/engine.Dockerfile
    ports:
      - "18080:8080"
    volumes:
      - ./engine:/app
    environment:
      - ENGINE_PORT=8080
      - ENGINE_TICK_HZ=${ENGINE_TICK_HZ:-60}
      - ENGINE_FLUSH_INTERVAL=${ENGINE_FLUSH_INTERVAL:-5m}
      - ENGINE_IDLE_EVICT=${ENGINE_IDLE_EVICT:-10m}
      - ENGINE_AOI_RADIUS=${ENGINE_AOI_RADIUS:-30}
      - ENGINE_GRID_CELL_SIZE=${ENGINE_GRID_CELL_SIZE:-4}
      - DATABASE_URL=postgres://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/game_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - db
      - redis

  sprite-gen:
    build:
      context: .
      dockerfile: sprite-gen/Dockerfile
    ports:
      - "18100:8100"
    environment:
      - DEVICE=cpu
      - SPRITE_BACKEND=sd-turbo
      - SPRITE_STORE_ENABLED=true
      - N_FRAMES=4
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - MINIO_BUCKET=sprites
      - SPRITE_GEN_SHARED_SECRET=${SPRITE_GEN_SHARED_SECRET:?SPRITE_GEN_SHARED_SECRET must be set in .env}
    volumes:
      - sprite-models:/root/.cache/huggingface
    depends_on:
      - minio

  # SOMET-368 -- public tunnel so someone outside this machine can play.
  # It points at the *frontend*, not the backend: vite proxies /api and the
  # /authority websocket through to backend:3101 (frontend/vite.config.js), so
  # one tunnel covers all three surfaces the game needs.
  #
  # Behind the `tunnel` profile deliberately: `make up` must never open a public
  # URL as a side effect. Start it with `make tunnel`, stop it with
  # `make tunnel-stop`. NGROK_DOMAIN/NGROK_AUTHTOKEN are read bare rather than
  # with the `${VAR:?}` idiom the other services use, because compose
  # interpolates the whole file whatever profile is active -- `:?` here would
  # break plain `make up` for anyone whose .env has no ngrok keys. `make tunnel`
  # does that check instead.
  #
  # Free tier allows ONE online agent per account: if another ngrok container is
  # up on the same authtoken, this one fails to bind and says so. That is the
  # correct behaviour, not something to work around.
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    command: http frontend:5173 --url=https://${NGROK_DOMAIN}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      # Request inspector, loopback-only -- the tunnel itself is the public part.
      - "127.0.0.1:14040:4040"
    depends_on:
      - frontend

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=game_db
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  sprite-models: