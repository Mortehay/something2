<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>something2</title>
  </head>
  <body>
    <!-- SOMET-742: on screen until React replaces it, so the bundle's download is not a blank page. -->
    <div id="root"><div style="position:fixed;inset:0;background:#16213a"><img id="boot-scene" src="/loading-scenes/forest.svg" alt="" style="width:100%;height:100%;object-fit:cover"></div></div>
    <script>
      // The scene of the world this browser last entered. Never interpolated: only a plain word gets through.
      try {
        var s = localStorage.getItem('something2.loadingScene');
        if (s && /^[a-z]+$/.test(s)) document.getElementById('boot-scene').src = '/loading-scenes/' + s + '.svg';
      } catch (e) { /* the default stays */ }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
